name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:

    # IMPORTANT:
    # This is your permanent Windows machine,
    # NOT a temporary GitHub-hosted VM.
    runs-on: [self-hosted, windows, permanent-rdp]

    timeout-minutes: 3600

    steps:

      # ---------------------------------------------------------
      # 1. Configure Windows Remote Desktop
      # ---------------------------------------------------------
      - name: Configure RDP
        shell: powershell
        run: |

          Write-Host "Configuring Remote Desktop..."

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Enable RDP service
          Set-Service `
            -Name TermService `
            -StartupType Automatic

          # Allow RDP through Windows Firewall
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          # Make sure RDP service is running
          Start-Service TermService

          Write-Host "RDP configured successfully."


      # ---------------------------------------------------------
      # 2. Create / configure RDP user
      # ---------------------------------------------------------
      - name: Configure RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $username = "RDP"

          if (-not $env:RDP_PASSWORD) {
              Write-Error "RDP_PASSWORD GitHub Secret is missing."
              exit 1
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          # Create user if it doesn't exist
          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if (-not $existingUser) {

              Write-Host "Creating RDP user..."

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires

          }
          else {

              Write-Host "RDP user already exists."

              # Update password
              Set-LocalUser `
                -Name $username `
                -Password $securePassword
          }

          # Add to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."


      # ---------------------------------------------------------
      # 3. Verify Tailscale
      # ---------------------------------------------------------
      - name: Check Tailscale
        shell: powershell
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale is not installed."
              exit 1
          }

          Write-Host "Tailscale status:"
          & $tailscale status

          Write-Host ""
          Write-Host "Tailscale IPv4:"

          $tsIP = (& $tailscale ip -4).Trim()

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not found."
              exit 1
          }

          Write-Host $tsIP


      # ---------------------------------------------------------
      # 4. Verify RDP port
      # ---------------------------------------------------------
      - name: Verify RDP Port
        shell: powershell
        run: |

          $tsIP = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim()

          Write-Host "Testing RDP:"
          Write-Host "$tsIP : 3389"

          $result = Test-NetConnection `
            -ComputerName $tsIP `
            -Port 3389

          if (-not $result.TcpTestSucceeded) {

              Write-Error "RDP port 3389 is not accessible."

              exit 1
          }

          Write-Host ""
          Write-Host "RDP port is accessible."


      # ---------------------------------------------------------
      # 5. Display RDP information
      # ---------------------------------------------------------
      - name: Show RDP Information
        shell: powershell
        run: |

          $tsIP = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim()

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          RDP SERVER READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Computer : $tsIP"
          Write-Host "Port     : 3389"
          Write-Host "Username : RDP"
          Write-Host ""
          Write-Host "Password is stored in GitHub Secret:"
          Write-Host "RDP_PASSWORD"
          Write-Host ""
          Write-Host "=========================================="
